name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOWORK: "off"
  CGO_ENABLED: "0"

jobs:
  test:
    name: Build + test + 100% coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Refuse a committed executable
        run: |
          # A built binary committed by a stray "git add" is invisible in a
          # diff, weighs more than the library, and is permanent once merged.
          # Naming one in .gitignore stops working the day the command is
          # renamed, so this asks what a file IS: the magic number of a
          # Mach-O, ELF or PE image. A bundled .ttf reads as font/sfnt and is
          # not caught. The separator is [[:space:]]+ and not a single
          # space because `file` pads its output into columns as soon as it is
          # given more than one name, which a pattern developed against one
          # file does not see.
          found=$(git ls-files -z | xargs -0 -r file --mime-type -- \
            | grep -E ':[[:space:]]+application/(x-mach-binary|x-executable|x-sharedlib|x-pie-executable|x-dosexec|vnd\.microsoft\.portable-executable)$' || true)
          if [ -n "$found" ]; then
            echo "::error::a built binary is committed:"
            echo "$found"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          check-latest: true
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Test with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Assert 100% statement coverage
        run: |
          # Exact, no rounding: fail if ANY line (per-function or the total) is
          # below 100.0%. The old `printf '%.0f'` on the aggregate let a
          # 99.95% slip through as "100" and masked an under-covered helper.
          go tool cover -func=coverage.out
          below=$(go tool cover -func=coverage.out | awk '$NF != "100.0%"')
          if [ -n "$below" ]; then
            echo "::error::coverage below 100% on:"
            echo "$below"
            exit 1
          fi

      - name: Cross-compile smoke (all 6 64-bit arches + wasm + darwin)
        run: |
          for arch in amd64 arm64 riscv64 loong64 ppc64le s390x; do
            echo "== linux/$arch =="
            GOOS=linux GOARCH=$arch go build ./...
          done
          GOOS=js     GOARCH=wasm  go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...

  # Cross-compiling proves the code COMPILES for an architecture. It does not
  # prove it works there. A font file is a big-endian container read byte by byte, and every
  # baked face in this package was produced by instancing one. Whether the
  # table readers reassemble those numbers correctly on a big-endian HOST has
  # never been exercised.
  #
  # s390x matters most: it is BIG-ENDIAN. poppler and pdfium do not test there
  # either, so a green lane here is a capability neither reference has.
  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, exec: "-exec=qemu-riscv64-static" }
          - { goarch: loong64, exec: "-exec=qemu-loongarch64-static" }
          - { goarch: ppc64le, exec: "-exec=qemu-ppc64le-static" }
          - { goarch: s390x,   exec: "-exec=qemu-s390x-static" }
          # 32-bit. Nothing here had ever been built for a 32-bit target,
          # let alone run on one -- and a 32-bit `int` is where a pixel count
          # that multiplies a width by a height stops fitting. poppler runs on
          # 32-bit ARM every day; this is not exotic ground.
          # 386 runs with NO emulator: a 386 ELF executes directly on the
          # x86-64 runner. That is not a convenience, it is a correctness
          # requirement. Measured on one commit of go-gfx/gfx, eight identical
          # lanes each:
          #
          #   under qemu-i386                    5 failures out of 8
          #   under qemu-i386, asyncpreemptoff=1 0 out of 8
          #   native on the same runner          0 out of 8
          #   under qemu-arm                     0 out of 8
          #
          # Each failure landed on a DIFFERENT input although the seed is
          # fixed, and the wrong value was a sign flip rather than a rounding
          # difference. qemu-i386 loses the guest's floating-point state across
          # the signal Go delivers for asynchronous preemption. Emulating 386
          # here would buy nothing and cost a lane that goes red at random.
          - { goarch: "386",   exec: "" }
          - { goarch: arm,     exec: "-exec=qemu-arm-static" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          check-latest: true
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Test under qemu (${{ matrix.goarch }})
        run: GOARCH=${{ matrix.goarch }} go test ${{ matrix.exec }} ./...
